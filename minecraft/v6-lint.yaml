      Negative instructions are numerous, but many are specific and useful.
      The larger issue is repetition: several exclusions already follow from
      positive Minecraft-native construction rules and recur again in local
      denomination sections.
    - >
      The proposal appropriately separates jury-facing material from generation
      prompts and production procedures, reducing workflow leakage.
findings:
  - id: PL-001
    category: missing_precision_high_leverage
    detector_family: '28. Missing precision in high-leverage variables'
    priority: high
    detector_confidence: high
    detected: >
      The series-wide banknote layout is defined through relative fields,
      alignments, and repeated positions, but the proposal does not give a
      canonical proportional grid, field occupancy, ore-label coordinates, or
      denomination aspect-ratio table. The proposal instead points to the
      current euro formats and repeatedly describes positions as stable or
      proportional.
    proxies:
      - 'three principal recto fields'
      - 'stable proportional alignments'
      - 'ore-label position and relative scale remain fixed'
      - 'current euro series proportions are referenced rather than reproduced'
    false_positive_risk: >
      A separate technical brief or layout master may already contain these
      values. If downstream generation always receives that master, the proposal
      itself does not need to repeat them.
    false_negative_risk: >
      Additional layout variables may also be underdefined, including exact
      institutional-field width, map field extent, numeral occupancy, and quiet
      zone dimensions.
    underlying_problem: >
      A downstream system reading the proposal alone must invent the geometry
      of a supposedly fixed series framework.
    why_it_matters: >
      Layout differences affect denomination recognition, ore-label placement,
      landscape crop, institutional balance, and series coherence before any
      scene detail is considered.
    review_questions:
      - 'Is there one canonical layout master that later generation always receives?'
      - 'Can the fixed fields be reconstructed from this proposal without consulting an external source?'
      - 'Which proportional relationships materially affect every generated face?'
    options:
      - id: A
        action: >
          Add one canonical proportional layout record covering denomination
          aspect ratios, the three principal fields, fixed alignment datums,
          and ore-label position and scale.
      - id: B
        action: >
          Keep the proposal relational, but designate an external technical
          layout master as the authoritative source for all geometry and state
          that later prompts inherit it unchanged.
      - id: C
        action: >
          Leave unchanged if no image-generation stage is expected to infer
          banknote geometry from this proposal alone.
    recommended_option: A
    expected_effect: >
      Converts repeated relational claims about fixed geometry into one usable
      source of truth and reduces whole-series layout drift.
    locations:
      - file: 'proposal-v6(1).md :contentReference[oaicite:0]{index=0}'
        section: '9.1 Format and proportion; 9.2 Shared recto composition; 9.5 Shared alignments; 9.7 What remains fixed and what changes'
        anchor: 'proportional grid, three principal fields, stable proportional alignments'
        proposal_lines: '488-602'
        evidence: 'The proposal specifies fixed fields and alignments but supplies them relationally. :contentReference[oaicite:1]{index=1} :contentReference[oaicite:2]{index=2}'
        related_locations:
