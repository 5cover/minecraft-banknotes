  general_observations:
    - >
      The proposal has explicit representation channels for all six denominations
      and gives every reverse a named dominant subject. This is a strong source
      specification foundation.
    - >
      The largest remaining stability risks are camera definition, common-layout
      geometry, cross-section source-of-truth drift, and the amount of secondary
      content permitted inside several reverses.
