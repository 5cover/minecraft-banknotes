  - id: PL-011
    category: human_presence
    detector_family: '28. Missing precision in high-leverage variables'
    priority: medium
    detector_confidence: medium
    detected: >
      Figure scale and narrative role are defined, but presence itself remains
      unresolved on many faces. Rectos permit figures to be absent or extremely
      limited. Versos describe work, teaching, maintenance, study, transport,
      and exchange, while only the emerald note clearly requires villagers.
    proxies:
      - 'human figures are absent or extremely limited'
      - 'figures remain small'
      - 'figures demonstrate work, study, exchange, repair, or civic use'
      - 'villagers appear only where mechanics are necessary'
      - 'activity verbs in local scenes without local presence decisions'
    false_positive_risk: >
      Tiny incidental figures may have little effect on composition when the
      system or building remains dominant.
    false_negative_risk: >
      Actor type matters as well as presence: players, villagers, and piglins
      carry different narrative meanings and may be inferred independently.
    underlying_problem: >
      The proposal defines what figures may do but not consistently whether each
      scene contains them.
    why_it_matters: >
      Populated and unpopulated versions of the same build communicate different
      scales of civic life and can alter visual density and attention.
    review_questions:
      - 'For each of the twelve faces, is figure presence required, prohibited, or intentionally variable?'
      - 'Which actor types are permitted on each reverse?'
      - 'Does an activity need a visible actor to remain legible?'
    options:
      - id: A
        action: >
          Add a face-level figure-presence field stating none, required small
          figures, or intentionally variable, with actor type where relevant.
      - id: B
        action: >
          Make all non-emerald figures absent unless a local scene explicitly
          requires them.
      - id: C
        action: >
          Keep the current flexible rule if figure presence is deliberately a
          low-level compositional variable.
    recommended_option: A
    expected_effect: >
      Prevents otherwise identical scenes from switching unpredictably between
      inhabited and empty civic systems.
    locations:
      - file: 'proposal-v6(1).md'
        section: '6.1 Recto: origin; 11.3 Human and villager figures'
        anchor: 'absent or extremely limited; figures remain small'
        proposal_lines: '269-283, 763-772'
        evidence: 'The common rules constrain figure role but not consistently their presence. :contentReference[oaicite:18]{index=18} :contentReference[oaicite:19]{index=19}'
        related_locations:
          - '15.4, 16.5, 17.5, 18.4, and 20.4 activity descriptions'
    decision: A
    note: >
      Add figures where it benefits to the story of the note. Only on reverses:
      - €20: players: people learning, studying, because knowledge needs minds
      - €100: players and villagers: required for trading and exchange. trading between players and villagers represents people of different origins exchanging on a market, pluralism
      - €200: players and piglins: required for institutional legitimacy, otherwise it's just a shiny building. People give the institution a reason to exist. Piglins are worth adding because gold structures their society too; they represent how gold can be a vector for civilization and commons, not just wealth
      No other plate should contain figures.

