  - id: PL-002
    category: missing_precision_high_leverage
    detector_family: '14. Unspecified camera or viewpoint'
    priority: high
    detector_confidence: high
    detected: >
      All six rectos identify environments and visible features, but none fixes
      a local camera height, viewing direction, or major crop. The shared camera
      rule says the recto should often resemble a selected in-game view, which
      is a preference rather than a camera specification.
    proxies:
      - 'should often feel close to an in-game view'
      - 'visible cliff face'
      - 'visible cavern surface'
      - 'high mountain landscape'
      - 'no recurring camera height or azimuth field in denomination sections'
    false_positive_risk: >
      Minecraft terrain morphology and the requirement for visible ore exposure
      already constrain some viewpoints, and deliberate camera variation may be
      part of denomination differentiation.
    false_negative_risk: >
      Even where the environment implies an angle, crop direction and foreground
      allocation can still vary enough to create materially different silhouettes.
    underlying_problem: >
      The recto specifications determine what exists but leave the image model
      to decide how the landscape is viewed.
    why_it_matters: >
      Camera choice controls ore visibility, terrain silhouette, negative space,
      depth, and how much of the landscape survives at banknote scale.
    review_questions:
      - 'What camera view makes each recto recognisable before colour is considered?'
      - 'Would an eye-level, elevated, or lateral interpretation all satisfy the current wording?'
      - 'Which direction must the exposed ore face relative to the frame?'
    options:
      - id: A
        action: >
          Give each recto a deliberate camera height, view direction, and major
          crop while preserving freedom in minor terrain details.
      - id: B
        action: >
          Define a small set of permitted recto camera families and assign one
          family to each denomination.
      - id: C
        action: >
          Leave camera selection to the generation workflow and explicitly mark
          it as an intentional variable rather than an unstated one.
    recommended_option: A
    expected_effect: >
      Stabilises recto silhouettes and ore exposure while preserving natural
      variation inside each landscape.
    locations:
      - file: 'proposal-v6(1).md'
        section: '11.2 Terrain and perspective'
        anchor: 'recto camera should often feel close to an in-game view'
        proposal_lines: '747-761'
        evidence: 'The shared recto camera direction remains qualitative. :contentReference[oaicite:3]{index=3}'
        related_locations:
          - '15.3 €5 Recto'
          - '16.4 €10 Recto'
          - '17.4 €20 Recto'
          - '18.3 €50 Recto'
          - '19.4 €100 Recto'
          - '20.3 €200 Recto'
    decision: A
    note: >
      Infer from the context for each recto. The ore remains the object of emphasis in every shot. Something like this
      Coal : outside, mountain, so aerial but close, coal in a mountainside
      Redstone : inside, deepslate cavern, ground level, like player perspective
      Lapis : semi inside, crevasse, like player perspective
      Copper : inside, stone cavern, like player perspective
      Emerald : outside, mountain, higher than coal, more aerial
      Gold : outside, surface, low aerial

  - id: PL-003
    category: missing_precision_high_leverage
    detector_family: '14. Unspecified camera or viewpoint'
    priority: high
    detector_confidence: high
    detected: >
      The reverses share an elevated oblique camera family, but the proposal
      explicitly permits variation in angle and distance and does not assign
      denomination-specific viewing directions. Several dominant silhouettes,
      especially the bridge, market square, and reserve complex, change
      substantially with azimuth.
    proxies:
      - 'elevated oblique viewpoint'
      - 'broad enough and close enough'
      - 'angle or distance need not be identical'
      - 'local reverse sections rarely state viewing direction'
    false_positive_risk: >
      The common camera family may be sufficient if a human art director selects
      compositions interactively rather than generating scenes independently.
    false_negative_risk: >
      Camera freedom can interact with object count and architectural layout,
      creating more variation than camera wording alone suggests.
    underlying_problem: >
      A series-wide camera family is defined, but the local pose needed to secure
      each denomination's intended silhouette remains unresolved.
    why_it_matters: >
      The same bridge can read as a long horizontal span or a foreshortened
      gateway; the same market can read as a square, street, or settlement;
      these are materially different banknote compositions.
    review_questions:
      - 'Which side of each dominant subject faces the viewer?'
      - 'Is the intended silhouette preserved across the full permitted camera family?'
      - 'Should camera variation be a series feature or only a small local adjustment?'
    options:
      - id: A
        action: >
          Retain the elevated-oblique series rule and add a denomination-specific
          camera direction and crop for each reverse.
      - id: B
        action: >
          Define a narrower common camera envelope with explicit orientation
          constraints for subjects whose silhouettes are view-dependent.
      - id: C
        action: >
          Leave unchanged if the downstream workflow tests several camera
          candidates and selects one against a fixed silhouette reference.
    recommended_option: A
    expected_effect: >
      Preserves the common spatial grammar while making each reverse reproducible
      enough to remain recognisable across independent generations.
    locations:
      - file: 'proposal-v6(1).md'
        section: '9.4 Verso hierarchy and shared viewpoint; 11.2 Terrain and perspective'
        anchor: 'all six reverses use an elevated oblique viewpoint'
        proposal_lines: '522-541, 747-761'
        evidence: 'The camera family is explicit, while local angle and distance remain variable. :contentReference[oaicite:4]{index=4} :contentReference[oaicite:5]{index=5}'
        related_locations:
          - '15.4-20.4 denomination verso sections'
    decision: A
    note: >
      Infer from the context for each recto. The ore remains the object of emphasis in every shot.
  - id: PL-004
    category: cross_section_contradiction
    detector_family: '24. Cross-section contradiction'
    priority: high
    detector_confidence: high
    detected: >
      The €10 canonical table and earlier series language identify an automation
      and logic hall, while the denomination section describes the mechanisms
      as a coherent campus containing multiple application zones. Hall and
      campus imply different dominant massing, circulation, object count, and
      silhouette.
    proxies:
      - 'automation and logic hall'
      - 'large redstone automation build'
      - 'arranged into a coherent campus'
      - 'multiple secondary applications'
    false_positive_risk: >
      Campus may have been intended as a loose synonym for a large hall with
      attached service areas.
    false_negative_risk: >
      Other summary references to research spaces and distributed systems may
      reinforce the larger campus interpretation even when they do not use that
      noun.
    underlying_problem: >
      Two competing spatial archetypes act as sources of truth for the same
      reverse.
    why_it_matters: >
      Independent generation can produce either one legible dominant building
      or a dispersed group of buildings, defeating the stated goal of one
      unmistakable centre of gravity.
    review_questions:
      - 'Is the €10 silhouette one principal hall or a multi-building campus?'
      - 'Which applications must be inside the dominant structure?'
      - 'Which wording is canonical for downstream scene generation?'
    options:
      - id: A
        action: >
          Select the hall as the canonical dominant structure and subordinate
          application zones within or immediately around it.
      - id: B
        action: >
          Select the campus as canonical and update the series table, summaries,
          and recognition language to describe that broader spatial type.
    recommended_option: A
    expected_effect: >
      Restores one dominant spatial archetype and reduces ambiguity in density,
      silhouette, and circulation.
    locations:
      - file: 'proposal-v6(1).md'
        section: '9.4 Verso hierarchy and shared viewpoint'
        anchor: '€10 automation and logic hall'
        proposal_lines: '530-539'
        evidence: 'The canonical table names a hall. :contentReference[oaicite:6]{index=6}'
        related_locations:
          - '16.5 €10 Verso, lines 995-1008: local scene becomes a coherent campus. :contentReference[oaicite:7]{index=7}'
    decision: A
    note: null

  - id: PL-005
    category: cross_section_contradiction
    detector_family: '24. Cross-section contradiction'
    priority: high
    detector_confidence: high
    detected: >
      The €50 reverse is locally defined as a major bridge and public-service
      span with a limited settlement, but the following historical layer says
      the meanings are distributed through the city and that the principal
      subject is a network inside and around architecture rather than one
      dominant structure.
    proxies:
      - 'major bridge and public-service span'
      - 'long span forms the dominant silhouette'
      - 'surrounding settlement remains limited'
      - 'meanings are distributed through the city'
      - 'principal subject is the network inside and around architecture'
    false_positive_risk: >
      The word city may only be conceptual shorthand for the civic system
      connected by the bridge.
    false_negative_risk: >
      The recognition summary also simplifies the denomination as copper
      supporting a city, which can further bias downstream interpretation away
      from the bridge.
    underlying_problem: >
      The denomination has two possible protagonists: a bridge span or a diffuse
      urban infrastructure network.
    why_it_matters: >
      Those choices yield different silhouettes, hierarchy, density, camera
      needs, and denomination recognition.
    review_questions:
      - 'Is the bridge itself the protagonist, or is it merely one part of a city-wide network?'
      - 'Should the settlement ever occupy enough area to read as a city?'
      - 'Which statement controls image generation when the two sections disagree?'
    options:
      - id: A
        action: >
          Keep the bridge span as the canonical protagonist and make the
          historical layer describe meanings visible on the span and its
          approaches.
      - id: B
        action: >
          Redefine the denomination around a distributed infrastructure network
          and update the dominant-subject table and recognition claims
          accordingly.
    recommended_option: A
    expected_effect: >
      Preserves the already-defined long-span silhouette and prevents the €50
      from drifting into another broad settlement scene.
    locations:
      - file: 'proposal-v6(1).md'
        section: '18.4 Verso; 18.5 European historical layer'
        anchor: 'bridge silhouette versus meanings distributed through the city'
        proposal_lines: '1193-1213'
        evidence: 'The two adjacent sections state competing centres of gravity. :contentReference[oaicite:8]{index=8}'
        related_locations:
          - '9.4 dominant verso table, €50 bridge and public-service span'
          - '24 Recognition and public comprehension, copper supports a city'
    decision: A
    note: null

  - id: PL-006
    category: stale_concept_residue
    detector_family: '23. Stale concept residue'
    priority: high
    detector_confidence: high
    detected: >
      The cross-denomination continuity section introduces one required-looking
      visual reference inside every note that is absent or not clearly
      canonical in the corresponding denomination scene specifications:
      signal mechanism, books and notation, copper-system diagrams, emerald
      market, gold reserve, and coal-fired furnace.
    proxies:
      - 'each note contains one controlled reference to the next stage'
      - 'six denomination-specific visual additions stated outside the local scene records'
      - 'local close-reading sections do not consistently repeat these additions'
    false_positive_risk: >
      These may be intended as optional close-reading details rather than
      required scene content.
    false_negative_risk: >
      Other summary tables also introduce secondary forms such as industrial
      terraces, converging roads, observatory functions, and civic beacon
      language that may not be fully canonical locally.
    underlying_problem: >
      Required visual content is being specified in a secondary continuity
      chapter rather than in one canonical denomination record.
    why_it_matters: >
      A generator or reviewer using only the local denomination section may omit
      the continuity reference, while another using the continuity chapter may
      add it and increase scene density.
    review_questions:
      - 'Are all six continuity references mandatory visible details?'
      - 'If mandatory, where is their hierarchy and scale specified?'
      - 'Should one canonical denomination record own these details?'
    options:
      - id: A
        action: >
          Treat each continuity reference as a required subordinate detail and
          move or mirror it into the denomination's canonical scene record with
          explicit hierarchy.
      - id: B
        action: >
          Make the continuity cycle conceptual only and state that these examples
          are not required visible elements.
      - id: C
        action: >
          Remove the six visual references if the series progression is already
          sufficiently legible without them.
    recommended_option: A
    expected_effect: >
      Eliminates hidden scene requirements and creates a single source of truth
      for each denomination.
    locations:
      - file: 'proposal-v6(1).md'
        section: '22. Continuity across denominations'
        anchor: 'each note contains one controlled reference to the next stage'
        proposal_lines: '1455-1473'
        evidence: 'Six denomination-specific continuity objects are introduced here. :contentReference[oaicite:9]{index=9}'
        related_locations:
          - '15.4-20.6 denomination scene and close-reading sections'
          - '21. Continuity between recto and verso'
    decision: other
    note: Keep the cross-denomination continuity section centralized. The continuity references are intentionally transversal and should remain required across the six-note sequence rather than being duplicated inside each denomination specification. Reword the section so that each reference is explicitly a discreet Easter-egg detail intended to reward careful looking, not an element needed for immediate scene comprehension, denomination recognition, or the dominant visual hierarchy. Each reference should remain subordinate enough that its absence from an initial reading does not weaken the note, while its discovery on closer inspection reveals the continuity chain across the series.

  - id: PL-007
    category: cross_denomination_sameness
    detector_family: '21. Cross-denomination sameness'
    priority: medium
    detector_confidence: medium
    detected: >
      Recto scene families repeat substantially: €10, €20, and €50 are cavern
      or cave compositions, while €5 and €100 are elevated mountain landscapes.
      Their material, colour, geology, and border logic differ, but the proposal
      also requires denomination discrimination through large-scale scene
      structure and grayscale performance.
    proxies:
      - 'three subterranean rectos'
      - 'two mountain rectos'
      - 'shared recto composition'
      - 'explicit grayscale scene-structure requirement'
    false_positive_risk: >
      Deepslate, open stone cavern, and dripstone cave can produce strongly
      different silhouettes, and the two mountain scenes can differ through
      altitude, valley form, and ore scarcity.
    false_negative_risk: >
      The missing local camera definitions may amplify the sameness by allowing
      generation to converge on familiar cave and cliff compositions.
    underlying_problem: >
      Series coherence may be relying on environmental category repetition more
      than the discrimination requirement can tolerate.
    why_it_matters: >
      At reduced size or without colour, three cave notes can become harder to
      distinguish even if their close-range materials differ.
    review_questions:
      - 'Can €10, €20, and €50 be identified from silhouette alone in grayscale?'
      - 'Can €5 and €100 be distinguished without relying on ore colour?'
      - 'Would fixed camera and dominant negative-space shapes solve the issue without changing the environments?'
    options:
      - id: A
        action: >
          Keep the current environments but assign each repeated environment a
          distinct dominant silhouette, camera, and foreground-background
          structure.
      - id: B
        action: >
          Replace one repeated environment if grayscale testing shows persistent
          confusion.
      - id: C
        action: >
          Leave unchanged if thumbnail and grayscale prototypes already
          demonstrate reliable discrimination.
    recommended_option: A
    expected_effect: >
      Preserves the material logic while making repeated landscape categories
      function as visibly different compositions.
    locations:
      - file: 'proposal-v6(1).md'
        section: '16.4, 17.4, 18.3, 15.3, 19.4 Recto sections'
        anchor: 'deepslate cavern, stone cavern, dripstone cave, mountain landscapes'
        proposal_lines: '909-924, 979-994, 1073-1086, 1177-1192, 1265-1280'
        evidence: 'The €10 and €20 rectos are both cavern scenes. :contentReference[oaicite:10]{index=10} :contentReference[oaicite:11]{index=11}'
        related_locations:
          - '€50 dripstone cave and €100 mountain. :contentReference[oaicite:12]{index=12} :contentReference[oaicite:13]{index=13}'
          - '8.5 Grayscale performance'
    decision: A
    note: null

  - id: PL-008
    category: unresolved_alternatives
    detector_family: '1. Unresolved alternatives'
    priority: medium
    detector_confidence: high
    detected: >
      The €20 reverse leaves several visible architectural choices open:
      candles or lamps; interior exposure through open courtyards, roofless
      galleries, windows, or cut-back walls; and an optional degree of interior
      revelation. These choices affect façade mass, lighting, roof silhouette,
      and how much of the library is interior versus exterior.
    proxies:
      - 'candles or lamps'
      - 'may reveal interior activity'
      - 'courtyards, roofless galleries, windows or cut-back walls'
    false_positive_risk: >
      Some of these alternatives can coexist harmlessly as minor details in a
      large Minecraft build.
    false_negative_risk: >
      The broader list of teaching, observation, restoration, pigment work, and
      enchanting also leaves unresolved how many subordinate zones are visible.
    underlying_problem: >
      The dominant subject is selected, but its architectural presentation is
      still a menu of substantially different ways to expose the interior.
    why_it_matters: >
      Independent generations can produce a closed library, an open cloister,
      a roofless mechanical cut-back, or a heavily windowed hall while all
      technically satisfy the text.
    review_questions:
      - 'Which single mechanism exposes the library interior most clearly?'
      - 'Which light source is part of the denomination identity?'
      - 'How much of the roof silhouette should remain intact?'
    options:
      - id: A
        action: >
          Select one primary interior-exposure mechanism and one principal
          lighting object for the canonical €20 composition.
      - id: B
        action: >
          Define one required mechanism and permit the others only as minor
          subordinate details.
      - id: C
        action: >
          Leave the alternatives open if deliberate variation among generated
          candidates is desired.
    recommended_option: A
    expected_effect: >
      Makes the library's massing and interior visibility repeatable without
      reducing the amount of close-reading detail available.
    locations:
      - file: 'proposal-v6(1).md'
        section: '17.5 €20 Verso'
        anchor: 'candles or lamps; open courtyards, roofless galleries, windows or cut-back walls'
        proposal_lines: '1087-1102'
        evidence: 'Several mutually substitutable visible constructions remain open. :contentReference[oaicite:14]{index=14}'
        related_locations:
          - '9.4 shared allowance for courtyards, open halls, terraces, or partial interiors'
    decision: A
    note: null

  - id: PL-009
    category: choice_budget_overload
    detector_family: '32. Choice-budget overload'
    priority: high
    detector_confidence: high
    detected: >
      The €100 reverse combines a dominant market square with a large village
      vocabulary, an unspecified set of professions, multiple secondary civic
      programs, a lapidary and verification workspace, and additional
      close-reading features. The hierarchy names the square as dominant but
      does not bound how many secondary zones or professions must be visible.
    proxies:
      - 'villagers of several professions'
      - 'long list of stalls, paths, farms, wells, storage, workshops, houses, fences, animals'
      - 'nine named professions in the narrative'
      - 'lapidary and verification workspace'
      - 'map stall, repair workshop, public ledger space, maintained infrastructure'
    false_positive_risk: >
      Village scenes naturally contain many canonical objects, and several can
      be represented as tiny texture-level details rather than independent
      subjects.
    false_negative_risk: >
      The continuity chapter additionally calls for a controlled gold reserve,
      which would add another program if treated as mandatory.
    underlying_problem: >
      The image model is told which ecosystem to depict but receives too much
      freedom over the visible subset, density, and participant mix.
    why_it_matters: >
      Different runs can range from a clear central market to a dense town
      panorama, changing silhouette, visual rest, and the prominence of emerald
      exchange.
    review_questions:
      - 'Which professions must actually be visible?'
      - 'How many subordinate program zones can the square support before it stops being the clear protagonist?'
      - 'Which close-reading elements are essential and which are conceptual background?'
    options:
      - id: A
        action: >
          Select a fixed small subset of visible professions and secondary zones,
          with the remaining professions retained only in rationale.
      - id: B
        action: >
          Keep the broader ecosystem but define explicit hierarchy tiers and
          maximum visible secondary groups.
      - id: C
        action: >
          Leave the full set available only if the generation workflow separately
          selects and records one canonical composition before producing final art.
    recommended_option: A
    expected_effect: >
      Reduces density drift and makes the market square, bell, and exchange
      relationships survive reliably at banknote scale.
    locations:
      - file: 'proposal-v6(1).md'
        section: '19.5-19.8 €100'
        anchor: 'several professions and multiple secondary market programs'
        proposal_lines: '1281-1339'
        evidence: 'The local specification contains many independently selectable visible elements. :contentReference[oaicite:15]{index=15} :contentReference[oaicite:16]{index=16}'
        related_locations:
          - '9.4 dominant verso table, €100 supporting environment'
          - '22. Continuity across denominations'
    decision: A
