  - id: PL-017
    category: false_precision
    detector_family: '27. False precision'
    priority: low
    detector_confidence: medium
    detected: >
      High-chroma accents are limited to approximately 3 to 5 percent of the
      visible surface. The number is precise enough to appear enforceable but
      the proposal does not identify a measurement method, mask, or production
      constraint that would make the percentage reproducible across highly
      different scenes.
    proxies:
      - 'approximately 3 to 5 percent'
      - 'surface-area percentage applied across six different compositions'
      - 'no stated measurement or enforcement method'
    false_positive_risk: >
      The percentage may be a useful art-direction heuristic for human designers
      even if it is not measured literally.
    false_negative_risk: >
      Other exact counts or ratios may also be decorative rather than
      stabilising, but most counts in the proposal correspond to real design
      invariants.
    underlying_problem: >
      Precision is allocated to an aesthetic quantity that may be less
      enforceable than unresolved camera, layout, or secondary-content choices.
    why_it_matters: >
      A downstream image model cannot reliably honour a visible-area percentage,
      while human reviewers may interpret the number as a hard compliance rule.
    review_questions:
      - 'Is 3 to 5 percent derived from a tested design constraint?'
      - 'Will anyone actually measure accent area?'
      - 'Would a rank-based rule such as small focal accents communicate the same intent more robustly?'
    options:
      - id: A
        action: >
          Keep the percentage only if a production-stage measurement method
          exists.
      - id: B
        action: >
          Replace the percentage with an ordinal compositional rule defining
          accents as a minor, localised colour tier.
      - id: C
        action: >
          Leave unchanged and explicitly treat the range as non-binding visual
          guidance.
    recommended_option: B
    expected_effect: >
      Moves precision away from a difficult-to-enforce surface estimate while
      preserving the intended restrained colour hierarchy.
    locations:
      - file: 'proposal-v6(1).md'
        section: '8.1 General rule'
        anchor: 'high-chroma accents limited to approximately 3 to 5 percent'
        proposal_lines: '437-448'
        evidence: "The percentage is the proposal's most conspicuous quantitative colour constraint. :contentReference[oaicite:27]{index=27}"
        related_locations:
          - '8.2 Shared palette structure'
          - 'denomination colour sections'
    decision: other
    note: 'Keep the approximate 3–5% figure because it usefully quantifies the intended visual scarcity of high-chroma accents more clearly than a purely qualitative instruction would. Reword the requirement to make explicit that the percentage is an indicative visual target, not a measured production constraint or compliance threshold. Its purpose is to communicate order of magnitude: high-chroma colour should occupy only a very small, localised portion of the composition.'

