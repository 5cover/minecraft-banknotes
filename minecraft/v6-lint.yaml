      - id: C
        action: >
          Designate an external master asset as authoritative and reference it
          explicitly from the proposal.
    recommended_option: A
    expected_effect: >
      Converts a relative consistency request into a reproducible fixed component
      and substantially reduces ore-label drift.
    locations:
