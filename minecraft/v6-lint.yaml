      - 'same apparent cube dimensions'
      - 'same lighting direction'
      - 'same distance from the frame'
      - 'same visual scale'
      - 'no canonical pose values or master asset named'
    false_positive_risk: >
      A production workflow may already reuse one master block render or scene,
      which would satisfy the invariant without numerical values in the proposal.
    false_negative_risk: >
      Texture sampling, shadow softness, and exact face visibility can also vary
      across independently generated blocks even when nominal angle and scale
      are similar.
    underlying_problem: >
      The most repeated denomination identifier depends on cross-image matching
      but lacks a concrete common reference.
    why_it_matters: >
      Independently generated ore blocks can drift in apparent rotation,
      lighting, cube scale, and face proportions, weakening one of the series'
      principal recognition devices.
    review_questions:
      - 'Is there one master ore-block pose reused for all six labels?'
      - 'What visible faces and lighting direction define that pose?'
      - 'Should later workflows generate six blocks independently at all?'
    options:
