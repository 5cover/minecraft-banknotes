generator: Built-in image generation; prompts in prompts/. No seed exposed.
rebuild: Retained image pixels plus deterministic Python composition; image regeneration
  is not deterministic.
source_assets:
  ore_rasters: assets/supplied/inputs/ores/
  font: assets/supplied/inputs/Minecraft.ttf
  map: assets/supplied/europe-map.svg
  flag: assets/supplied/europe-flag.svg
approved_asset_changes:
  font: Eight required capitals added with distinct Unicode entries; seven source-outline
    matches and a new grid-drawn omega. Existing glyphs and mappings preserved. See
    scripts/build_type_assets.py.
  type: Outlined SVG denominations fitted to controlled monetary boxes. Three-script
    block grouped at equal cap height.
  ore: Transparent-bound crop and common fit; original pixels and pose retained; no
    generated replacement.
  map: Unchanged SVG geometry; denomination-ink fill and uniform 70 percent alpha
    at composition.
  flag: Unchanged geometry and colours; 92 percent opacity at composition.
  scene: Recorded fitted crop plus edge-pixel extension hidden under frame.
  finish: Feathered script underprint and seeded fine paper grain.
