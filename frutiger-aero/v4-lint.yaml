findings:
  - id: PL-001
    category: missing_precision_in_high_leverage_variables
    detector_family: '28. Missing precision in high-leverage variables'
    title: 'The shared monetary grid is asserted but not spatially anchored'
    priority: high
    detector_confidence: high
    detected: 'The proposal says recto and verso share a stable grid, but the actual value, institutional, map, flag, signature, and quiet-space zones are described with relative language rather than frame-fixed positions. Final scene prompts therefore have no deterministic interface to the monetary scaffold.'
    proxies:
      lexical:
        - '“near one short edge”'
        - '“integrated into the remaining negative space”'
        - '“flag location family”'
        - '“map field family”'
        - '“overlaps ... in a controlled way”'
      structural:
        - 'Section 3 names a shared recto and verso grid as a common invariant.'
        - 'Sections 11.2 to 11.5 describe zones and stable element families without fixing left/right anchoring or reserved scene bounds.'
        - 'The denomination prompts position scene subjects relative to the image frame but not relative to those monetary zones.'
      semantic:
        - 'A fixed grid that is not frame-addressable leaves the generator or later assembler to decide where major information fields and quiet space actually sit.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The fixed-grid claim is explicit, and the cited zone language is visibly relative; the downstream interface gap follows directly unless an external mask is assumed.'
    possible_false_positives:
      - 'A separate layout document may already contain exact masks or coordinates and may be guaranteed as an input to every downstream composition step.'
      - 'The proposal may intentionally leave typographic layout outside narrative-scene generation.'
    possible_false_negatives:
      - 'Even after left/right anchors are fixed, overlap limits, crop-safe areas, and reserved contrast zones could remain under-specified.'
    underlying_specification_problem: 'The proposal has a series-wide layout invariant in concept but not a concrete contract that independently generated scenes can obey.'
    why_it_matters: 'Dominant subjects can land under numerals, maps, signatures, or security reservations; later cropping can damage silhouettes; mirrored interpretations can make the series feel less stable.'
    review_questions:
      - 'Which short edge owns the principal value zone on recto and verso?'
      - 'Which areas must remain low-detail or low-contrast for institutional artwork?'
      - 'Are narrative images generated into fixed masks, or are they expected to discover the banknote layout themselves?'
      - 'Which overlaps are permitted and which are forbidden?'
    resolution_options:
      - id: A
        action: 'Define a canonical recto and verso grid with named frame-relative zones and simple occupancy rules.'
      - id: B
        action: 'Move exact masks to one canonical layout specification and make every scene prompt explicitly target those named image-field masks.'
      - id: C
        action: 'Leave the proposal unchanged only if an external canonical grid is guaranteed downstream and cannot diverge by denomination.'
    recommended_option: B
    expected_effect: 'Creates a clean interface between scene generation and monetary assembly, reduces subject collisions, and makes quiet-space requirements operational without requiring arbitrary pixel precision.'
    location:
      file: 'proposal-v4(1).md'
      section: '11.2 Recto composition'
      anchor: 'a value zone near one short edge'
      related_locations:
        - section: '3. Assessment framework'
          anchor: 'a shared recto and verso grid'
        - section: '7.4 Quiet space'
          anchor: 'Empty space is not unfinished space.'
        - section: '11.3 Verso composition'
          anchor: 'a compact institutional zone'
        - section: '11.4 Shared alignments'
          anchor: 'flag location family'
        - section: '11.5 Fixed and variable elements'
          anchor: 'recto composition'
        - section: 'Appendix A. Prompt specification'
          anchor: 'Precise lettering, maps, serials, signatures'
    decision: B
    note: null

  - id: PL-002
    category: cross_section_contradiction
    detector_family: '24. Cross-section contradiction'
    title: 'Executable prompts do not state the scene-only generation boundary'
    priority: high
    detector_confidence: high
    detected: 'Appendix A assigns lettering, maps, serials, signatures, and technical security features to controlled artwork outside scene generation, yet all twelve prompts open by asking for a banknote concept scene without a common instruction that only the narrative image field should be generated. Only a subset explicitly excludes generated text.'
    proxies:
      lexical:
        - '“Create the recto scene for a horizontal €5 Living Systems euro banknote concept” and equivalent openings'
        - '“Precise lettering, maps, serials, signatures, and technical security features remain controlled artwork outside scene generation.”'
        - '“no generated text” appears locally rather than universally'
      structural:
        - 'The production boundary is defined in Appendix A but is not carried into the standalone prompt text.'
        - 'Text-related exclusions are inconsistent across denomination prompts.'
      semantic:
        - 'A model can reasonably interpret “euro banknote concept” as a request to render a complete note, including pseudo-lettering, numerals, borders, or map-like elements.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The outside-scene boundary is explicit in Appendix A, while the standalone prompt bodies omit a universal scene-only constraint; the mismatch is textual and repeated across all twelve prompts.'
    possible_false_positives:
      - 'A downstream wrapper may always prepend a scene-only scope rule before these prompt bodies.'
      - 'The word “scene” may be sufficient for a particular generation pipeline that is already conditioned on image-field output.'
    possible_false_negatives:
      - 'Even with a scene-only instruction, models may still introduce text-like marks unless the allowed output surface is also positively defined.'
    underlying_specification_problem: 'The proposal separates generated narrative imagery from controlled monetary artwork conceptually, but the executable prompt boundary is not self-contained.'
    why_it_matters: 'Independent generations may return complete mock banknotes or pseudo-lettering, wasting prompt budget and producing outputs that cannot be cleanly assembled into the controlled monetary layout.'
    review_questions:
      - 'Are these twelve prompt bodies executed standalone?'
      - 'Should the generator output only the narrative image field, with no numeral, map, flag, lettering, serial, signature, border, or security artwork?'
      - 'If a wrapper supplies that rule, is the wrapper canonical and versioned with the proposal?'
    resolution_options:
      - id: A
        action: 'Add one common scene-only scope invariant to every executable prompt.'
      - id: B
        action: 'Change the prompt contract so the denomination text describes only the narrative image field, while a canonical wrapper supplies all common exclusions and layout boundaries.'
      - id: C
        action: 'Leave the prompt bodies unchanged only if the downstream wrapper is guaranteed and documented as the sole execution path.'
    recommended_option: B
    expected_effect: 'Reduces accidental pseudo-banknote generation, clarifies what the image model owns, and keeps controlled monetary artwork outside the stochastic generation step.'
    location:
      file: 'proposal-v4(1).md'
      section: 'Appendix A. Prompt specification'
      anchor: 'remain controlled artwork outside scene generation'
      related_locations:
        - section: '17.7 Prompt'
          anchor: 'Create the recto scene for a horizontal €5'
        - section: '18.7 Prompt'
          anchor: 'Create the recto scene for a horizontal €10'
        - section: '19.7 Prompt'
          anchor: 'Create the recto scene for a horizontal €20'
        - section: '20.7 Prompt'
          anchor: 'no generated text'
        - section: '21.7 Prompt'
          anchor: 'Create the recto scene for a horizontal €100'
        - section: '22.7 Prompt'
          anchor: 'Create the recto scene for a horizontal €200'
        - section: '27. Excluded elements'
          anchor: 'campaign slogans and generated pseudo-lettering'
    decision: B
    note: The model reads the proposal as a whole and generates all images. Individual prompts are basically structuarl image descriptions in a higher level of detail. No security features, serial number, signature or artificial printed border details should appear, but the numeral and lettering are to be included.

  - id: PL-003
    category: relational_vagueness
    detector_family: '16. Relational vagueness'
    title: 'The €5 recto specifies towers but not the visible electrical connection between them'
    priority: high
    detector_confidence: high
    detected: 'The €5 recto fixes one dominant transmission tower and exactly two receding towers, but neither the scene description nor the executable prompt explicitly requires conductor wires connecting the three structures. The text says the towers establish continuation of the grid, leaving the key visible relationship to model inference.'
    proxies:
      lexical:
        - '“Exactly two smaller towers recede diagonally”'
        - '“establish the continuation of the grid”'
        - 'absence of a conductor-line or cable requirement in the recto prompt'
      structural:
        - 'The conceptual relationship depends on transmission, but the concrete scene specification enumerates structures without the connecting geometry.'
      semantic:
        - 'Three isolated towers can satisfy the object list while failing to show electricity moving through a physical grid.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The towers and grid meaning are explicit, and the conductor relationship is absent from both the scene description and prompt; only model convention could fill it.'
    possible_false_positives:
      - 'Many image models will infer power conductors automatically from a row of high-voltage towers.'
      - 'The designer may intentionally accept line variation because the tower sequence alone remains recognisable.'
    possible_false_negatives:
      - 'Adding conductors alone would still leave pylon family, cross-arm arrangement, circuit count, and sag behavior open if those materially affect the intended silhouette.'
    underlying_specification_problem: 'The protagonist objects are fixed, but the relationship that makes them a transmission system is implicit.'
    why_it_matters: 'A missing or inconsistent conductor pattern changes the scene from a grid to a set of pylons and can materially alter the dominant diagonal rhythm used for denomination recognition.'
    review_questions:
      - 'Must all three towers be visibly connected by conductors?'
      - 'Does the pylon family itself need one defined structural grammar?'
      - 'How much wire detail survives at banknote scale without becoming fine-line clutter?'
    resolution_options:
      - id: A
        action: 'Require visible conductor bundles connecting all three towers and select one stable pylon family.'
      - id: B
        action: 'Require the connecting conductors but leave minor pylon construction variation open.'
      - id: C
        action: 'Leave unchanged only if isolated tower silhouettes are explicitly acceptable and the transmission relation is expected to be inferred.'
    recommended_option: B
    expected_effect: 'Makes the transmission mechanism visible and stabilises the intended diagonal grid rhythm while preserving reasonable engineering simplification.'
    location:
      file: 'proposal-v4(1).md'
      section: '17.3 Recto: transmission'
      anchor: 'establish the continuation of the grid'
      related_locations:
        - section: '17.7 Prompt'
          anchor: 'exactly two smaller transmission towers receding diagonally'
        - section: '17.5 Conceptual relationship'
          anchor: 'electricity transmitted'
        - section: '10.5 Grayscale performance'
          anchor: 'transmission-tower verticals'
    decision: B
    note: Seems like the prompt can be simplified. Maybe the semantic shortcut is something like "power line". It's a common concept.

  - id: PL-004
    category: relational_vagueness
    detector_family: '16. Relational vagueness'
    title: 'Several final scenes remain mirrorable because frame-relative direction is not resolved'
    priority: medium
    detector_confidence: high
    detected: 'Multiple scenes specify ordered relationships but stop short of assigning them to a definite side or diagonal of the banknote frame. The €5 cooling towers are “to one side,” the switchyard is on the “opposite side,” the €10 dish spine has no named diagonal direction, the €20 rail link leaves toward an undefined “inland side,” and the €100 forest and agriculture occupy opposite river sides without assigning which bank.'
    proxies:
      lexical:
        - '“behind and to one side”'
        - '“opposite side”'
        - '“same diagonal service spine”'
        - '“toward the inland side of the image”'
        - '“one side of the river” and “opposite side”'
      structural:
        - 'The proposal says final scenes fix main directional geometry, but these relationships retain a mirror choice.'
      semantic:
        - 'Mirroring can change where dense secondary masses fall relative to value and institutional zones even when the scene meaning remains the same.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The cited phrases preserve literal side or diagonal freedom. Whether that freedom is harmful depends on the monetary layout, but the unresolved branch itself is unambiguous.'
    possible_false_positives:
      - 'Horizontal mirroring may be intentionally harmless if scene masks and banknote information zones are symmetric.'
      - 'A downstream compositor may choose the mirror direction deterministically after generation.'
    possible_false_negatives:
      - 'Other minor left/right choices, such as the relative placement of €200 verso secondary components, may remain open even after these larger relationships are fixed.'
    underlying_specification_problem: 'The document resolves object relationships but does not consistently resolve their orientation relative to the note frame.'
    why_it_matters: 'Independent runs can produce mirrored density, different overlap patterns, and different availability of quiet space, which may interfere with the shared monetary layout.'
    review_questions:
      - 'Is horizontal mirroring an allowed degree of freedom for final scenes?'
      - 'If not, which side of the frame should each major secondary mass occupy?'
      - 'Should orientation be derived from the common monetary grid instead of repeated locally?'
    resolution_options:
      - id: A
        action: 'Fix frame-relative direction for every listed relationship in the local scene specifications.'
      - id: B
        action: 'Declare horizontal mirroring intentionally permitted and require the monetary layout to tolerate either orientation.'
      - id: C
        action: 'Resolve orientation through one shared rule tied to the canonical value and institutional zones.'
    recommended_option: C
    expected_effect: 'Removes hidden mirror branches while avoiding repetitive local direction rules and aligns spatial density with the common note scaffold.'
    location:
      file: 'proposal-v4(1).md'
      section: '17.4 Verso: generation'
      anchor: 'behind and to one side of the reactor complex'
      related_locations:
        - section: '18.4 Verso: radiocommunications complex'
          anchor: 'same diagonal service spine'
        - section: '19.4 Verso: port logistics'
          anchor: 'toward the inland side of the image'
        - section: '21.4 Verso: watershed stewardship system'
          anchor: 'one side of the river'
        - section: '17.7 Prompt'
          anchor: 'switchyard on the opposite side'
        - section: '21.7 Prompt'
          anchor: 'managed green agricultural land on the opposite side'
    decision: C
    note: null

  - id: PL-005
    category: abstract_visual_nouns_and_placeholder_architecture
    detector_family: '10. Abstract visual nouns and placeholder architecture'
    title: 'The €10 recto dominant mast lacks a defined structural and antenna typology'
    priority: high
    detector_confidence: high
    detected: 'The €10 recto depends on a single telecommunications mast as its dominant silhouette, but the proposal does not state whether it is a lattice tower, tubular monopole, guyed mast, self-supporting mast, or what visible antenna hardware identifies it as telecommunications rather than generic utility infrastructure.'
    proxies:
      lexical:
        - '“one telecommunications mast”'
        - '“simplified credible structure”'
      structural:
        - 'The grayscale identity explicitly relies on the singular vertical mast.'
        - "The scene gives exact camera and shelter placement but leaves the dominant object's construction family open."
      semantic:
        - 'Different valid interpretations of “telecommunications mast” have materially different silhouettes and can imply different technologies.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The mast is the dominant and grayscale-defining object, yet no structural or antenna family is stated. Multiple materially different mast typologies satisfy the noun.'
    possible_false_positives:
      - 'A broad mast family may be intentionally accepted because the low-angle vertical silhouette is the primary recognition cue.'
      - 'A visual reference set may later constrain the typology.'
    possible_false_negatives:
      - 'Even after a mast family is chosen, antenna count and mounting height could still create visible drift if left unbounded.'
    underlying_specification_problem: 'The proposal fixes the protagonist noun but not enough of the protagonist geometry to make independent generations converge.'
    why_it_matters: 'The €10 recto may oscillate between very different tower forms, weakening denomination identity and increasing the chance of generic or non-European telecommunications imagery.'
    review_questions:
      - 'What structural family should the mast use?'
      - 'Which visible antenna elements are necessary for immediate telecommunications recognition?'
      - 'Are guy wires acceptable, or would they disrupt the clean vertical silhouette?'
    resolution_options:
      - id: A
        action: 'Select one mast structural family and one restrained antenna arrangement.'
      - id: B
        action: 'Define a small allowed mast family with invariant silhouette features and antenna placement.'
      - id: C
        action: 'Leave the mast generic only if silhouette variation is intentional and acceptable in the final series.'
    recommended_option: A
    expected_effect: "Stabilises the €10 thumbnail silhouette and reduces the model's need to invent the most visible engineering details."
    location:
      file: 'proposal-v4(1).md'
      section: '18.3 Recto: terrestrial communication'
      anchor: 'The dominant element is one telecommunications mast'
      related_locations:
        - section: '18.7 Prompt'
          anchor: 'Place one tall telecommunications mast'
        - section: '10.5 Grayscale performance'
          anchor: 'singular vertical mast'
        - section: '14. Accessibility and denomination discrimination'
          anchor: 'tall mast'
    decision: A
    note: Whichever kind is most common for mobile service in europe.

  - id: PL-006
    category: unspecified_cardinality
    detector_family: '13. Unspecified cardinality'
    title: 'The €20 verso leaves freight-vehicle density open'
    priority: low
    detector_confidence: high
    detected: 'The €20 verso fixes the ship, crane count, rail spur, and road, but asks the road to carry a “small number of freight vehicles” without a count or range.'
    proxies:
      lexical:
        - '“a small number of freight vehicles”'
      structural:
        - 'Other visually consequential port objects have exact counts, making this one plural an explicit remaining degree of freedom.'
      semantic:
        - 'Vehicle count can alter local density, but the vehicles are clearly subordinate and may be too minor to justify exact control.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The phrase “small number” is a direct unbounded cardinality marker. Its priority is low because the vehicles are explicitly subordinate.'
    possible_false_positives:
      - 'The vehicles may be small enough at banknote scale that count variation is harmless.'
    possible_false_negatives:
      - 'Container-stack density is also unbounded and could matter more than the vehicle count in some generations.'
    underlying_specification_problem: 'A low-value secondary detail is specified strongly enough to invite generation but not strongly enough to stabilise its density.'
    why_it_matters: 'The clause can create unnecessary variation or extra clutter without materially improving the port concept.'
    review_questions:
      - 'Do freight vehicles add meaning beyond the already specified road and rail link?'
      - 'If they remain, does their count materially affect the composition?'
    resolution_options:
      - id: A
        action: 'Fix a small exact count or narrow range.'
      - id: B
        action: 'Remove freight vehicles and let the road itself communicate the road-logistics link.'
      - id: C
        action: 'Leave unchanged if vehicle count is intentionally non-consequential.'
    recommended_option: B
    expected_effect: 'Reduces a minor source of density variation and simplifies the port hierarchy without weakening the people-versus-goods contrast.'
    location:
      file: 'proposal-v4(1).md'
      section: '19.4 Verso: port logistics'
      anchor: 'carries a small number of freight vehicles'
      related_locations:
        - section: '19.7 Prompt'
          anchor: 'with a small number of freight vehicles'
    decision: B
    note: null

  - id: PL-007
    category: noun_hierarchy_overload
    detector_family: '33. Noun-hierarchy overload'
    title: 'The €50 verso does not uniquely define what an “empty orchestra” physically contains'
    priority: high
    detector_confidence: high
    detected: 'The scene repeatedly calls for an “empty orchestra” while also forbidding musicians and audience. The string sections are defined by empty chairs and music stands, woodwind and brass instruments are physically present, four timpani are fixed, and the prompt later says to keep “the instruments physically present in their sections.” It is unclear whether string instruments are present, how many wind and brass instruments appear, and what “orchestra” means when no people are present.'
    proxies:
      lexical:
        - '“empty orchestra”'
        - '“Empty chairs and black music stands define the string sections”'
        - '“Woodwind instruments occupy the central middle rows.”'
        - '“Brass instruments occupy the rear rows.”'
        - '“Keep the instruments physically present in their sections and leave every chair empty.”'
      structural:
        - 'The scene contains several instrument families with only timpani cardinality fixed.'
        - 'The dominant geometry is resolved, but the physical contents of that geometry are not.'
      semantic:
        - 'The noun “orchestra” commonly denotes the ensemble of players, while this proposal intends a staged physical arrangement with no people.'
        - 'The string-section wording and the later all-instruments wording can lead to different valid object sets.'
    proxy_confidence: high
    proxy_confidence_rationale: 'The object inventory contains a real semantic tension between an empty orchestra, absent people, empty string chairs, and physically present instruments. Multiple distinct renderings satisfy the current wording.'
    possible_false_positives:
      - 'A generator may infer the intended staged orchestral setup reliably from the no-musicians constraint.'
      - 'Exact naturalistic orchestra counts may be intentionally avoided because they would create excessive detail.'
    possible_false_negatives:
      - 'Even after instrument identity is resolved, chair and music-stand density may still vary enough to change the semicircular mass.'
    underlying_specification_problem: "The denomination's most complex interior scene has a resolved camera and layout but an unresolved physical inventory at the centre of the image."
    why_it_matters: 'Generations may add players, omit string instruments, produce instrument-storage imagery, or create radically different stage density, reducing consistency and making the intended institutional still-life less legible.'
    review_questions:
      - 'Is the intended subject an orchestral stage setup rather than an orchestra as a group of people?'
      - 'Which instrument families must be physically visible?'
      - 'Should strings be represented by instruments, by chairs and stands only, or by a bounded mix?'
      - 'What section-level density is sufficient at banknote scale?'
    resolution_options:
      - id: A
        action: 'Define the physical stage setup directly, including which instrument families are present and bounded section densities, while keeping all people absent.'
      - id: B
        action: 'Use a deliberately sparse symbolic setup with chairs, stands, four timpani, and only a few representative wind and brass instruments.'
      - id: C
        action: 'Permit naturalistic instrument-count variation but state explicitly that no human figure is part of the orchestra in this image.'
    recommended_option: A
    expected_effect: 'Removes the largest remaining choice cluster in a final scene and makes the verso reproducible without forcing unrealistic instrument-by-instrument precision.'
    location:
      file: 'proposal-v4(1).md'
      section: '20.4 Verso: orchestral cultural form'
      anchor: 'The verso shows an empty orchestra already arranged'
      related_locations:
        - section: '20.4 Verso: orchestral cultural form'
          anchor: 'Empty chairs and black music stands define the string sections'
        - section: '20.4 Verso: orchestral cultural form'
          anchor: 'The instruments remain placed in their sections'
        - section: '20.7 Prompt'
          anchor: 'Keep the instruments physically present in their sections'
        - section: '13. Human presence'
          anchor: 'The €50 verso contains no musicians and no audience.'
        - section: '23. Continuity between recto and verso'
          anchor: 'empty orchestra in concert hall'
    decision: A
    note: null

  - id: PL-008
    category: additive_instruction_accumulation
    detector_family: '8. Additive instruction accumulation'
    title: 'The €100 verso adds unspecified monitoring equipment beyond its declared complexity budget'
    priority: medium
    detector_confidence: medium
    detected: 'The €100 verso adds “discreet monitoring equipment” beside the wetland, but the earlier deliberate-complexity definition lists the river, turbines, solar field, wetland, reforestation, agriculture, and water-control structure without monitoring equipment. The added object has no type or count.'
    proxies:
      lexical:
        - '“Discreet monitoring equipment sits beside the wetland”'
        - '“Add ... discreet monitoring equipment beside the wetland.”'
      structural:
        - 'Section 7.3 explicitly enumerates the €100 complexity exception but omits this element.'
        - 'The element appears in the detailed scene and prompt as an additional subordinate object class.'
      semantic:
        - 'The stewardship concept is already carried by several concrete systems, so unspecified monitoring hardware may add density without a distinct visual job.'
    proxy_confidence: medium
    proxy_confidence_rationale: 'The monitoring element is explicitly present in the final scene and prompt but absent from the earlier declared complexity inventory. Its visual importance is uncertain, so confidence is not high.'
    possible_false_positives:
      - 'Monitoring may be an important conceptual signal of active stewardship and may have been intentionally added after the earlier hierarchy section.'
      - 'The equipment may be tiny enough to have negligible compositional effect.'
    possible_false_negatives:
      - 'Other low-value additions within the watershed scene may also be removable even though they are more concretely specified.'
    underlying_specification_problem: 'A deliberately complex scene has acquired one more visible object class without integrating it into the canonical complexity rationale or resolving its appearance.'
    why_it_matters: 'The model may invent sensor towers, cabinets, masts, drones, or other devices, increasing clutter and adding stylistic variance to the one scene already allowed the largest object budget.'
    review_questions:
      - 'Does monitoring equipment carry meaning that the water-control, restoration, forestry, agriculture, and renewable systems do not already communicate?'
      - 'If it matters, what single visible monitoring device should represent it?'
      - 'Should the canonical €100 complexity list be updated if the element remains?'
    resolution_options:
      - id: A
        action: 'Remove the monitoring equipment from the scene and prompt.'
      - id: B
        action: 'Replace the abstract plural with one specific, visually minor monitoring device and add it to the canonical €100 hierarchy.'
      - id: C
        action: 'Leave unchanged if downstream reference imagery fixes the equipment consistently.'
    recommended_option: A
    expected_effect: 'Reduces additive density in the deliberate complexity exception and keeps the watershed organised around the already resolved landscape systems.'
    location:
      file: 'proposal-v4(1).md'
      section: '21.4 Verso: watershed stewardship system'
      anchor: 'Discreet monitoring equipment sits beside the wetland'
      related_locations:
