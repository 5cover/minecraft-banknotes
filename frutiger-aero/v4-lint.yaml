          anchor: 'discreet monitoring equipment beside the wetland'
        - section: '7.3 Deliberate exception: €100'
          anchor: 'The verso is deliberately richer'
        - section: '2.3 Representation channels'
          anchor: 'integrating renewable energy, water management, restoration, forestry, and agriculture'
    decision: A
    note: null

  - id: PL-009
    category: missing_precision_in_high_leverage_variables
    detector_family: '28. Missing precision in high-leverage variables'
    title: 'The €200 recto fixes orbital attitude more precisely than the dominant vehicle silhouette'
    priority: high
    detector_confidence: high
    detected: 'The €200 recto tightly fixes left-to-right motion, tangent alignment, a five-degree attitude tolerance, Earth placement, and plume direction, but the dominant subject remains an “anonymous European-style upper stage” with no stable body proportion, engine/nozzle count, forebody treatment, or other defining silhouette features.'
