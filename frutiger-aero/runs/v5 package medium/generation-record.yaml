stable_assets:
  lettering:
    source: assets/supplied/DejaVuSans.ttf
    builder: scripts/build_assets.py
    derivatives: assets/approved/value_*.svg, type_*.svg, currency_group.svg and compact PNG masks
    treatment: Checked glyph coverage; explicit tracking; equal optical cap heights for the grouped three-script inscription.
  map:
    source: assets/supplied/natural-earth-countries.geojson
    source_url: https://github.com/nvkelso/natural-earth-vector/blob/master/geojson/ne_110m_admin_0_countries.geojson
    derivatives:
    - assets/approved/europe.svg
    - assets/approved/europe_mask.png
    treatment: European geographic crop; consistent equirectangular scaling; country fills merged visually without internal borders; denomination-specific lines clipped to the same mask.
  flag:
    builder: scripts/build_assets.py
    derivatives:
    - assets/approved/european_flag.svg
    - assets/approved/european_flag.png
    treatment: One 3:2 blue field and twelve upright yellow five-pointed stars; geometry shared across rectos.
composition:
  builder: scripts/build_notes.py
  context_builder: scripts/build_contexts.py
  artwork_isolation: scripts/isolate_artwork.py
  source_transform: Inverse source luminance, black threshold 0.015, multiplied by source alpha and recorded density gain; clamped and tinted with denomination ink at recorded opacity.
  layer_order:
  - primary
  - quiet
  - monetary_artwork
  - fixed
  placement: Uniform cover fit with full-source crop and recorded centering; exact output dimensions; smooth quiet-field fade.
